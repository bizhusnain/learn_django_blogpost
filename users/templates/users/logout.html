{% extends 'base.html' %}

{% block page_title %}
Logged Out
{% endblock page_title %}

{% block content %}
<div class="col-md-5 mx-auto mt-5">
    <div class="card bg-dark text-light border-secondary shadow-lg">
        <div class="card-body p-5 text-center">
            <!-- Checkmark / Success Icon -->
            <div class="mb-4 text-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor"
                    class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                    <path
                        d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l5-5.25a.75.75 0 0 0-.02-1.06z" />
                </svg>
            </div>

            <h2 class="h3 fw-bold mb-3 text-white">Logged Out</h2>
            <p class="text-light opacity-75 mb-4">
                You have been successfully signed out of your account.
            </p>

            <div class="d-grid gap-2">
                <a href="{% url 'users:login' %}" class="btn btn-primary py-2 fw-semibold">
                    Log In
                </a>
                <a href="{% url 'blogs:home' %}" class="btn btn-outline-secondary py-2 text-light">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
